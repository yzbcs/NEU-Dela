<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="NEU Dot 是面向东北大学同学的桌面工作台。把课表、待办、笔记、邮件和 AI 放在一起。">
<meta name="theme-color" content="#edf1e9">
<link rel="canonical" href="https://yzbcs.github.io/NEU-Dela/">
<link rel="icon" href="./assets/icon.png">
<link rel="stylesheet" href="./style.css?v=study-tour-4">
<script src="./demo.js?v=study-tour-4" defer></script>
<title>NEU Dot · 东大学生的桌面工作台</title>
</head>
<body>
<header class="wrap nav">
<a class="brand" href="./"><img src="./assets/icon.png" width="34" height="34" alt=""> NEU Dot</a>
<nav aria-label="主导航"><a href="#demo">功能演示</a><a href="https://github.com/yzbcs/NEU-Dela">GitHub ↗</a></nav>
</header>
<main>
<section class="hero wrap" aria-labelledby="title">
<p class="tag"><span></span> 为东北大学同学制作的桌面应用</p>
<h1 id="title">打开电脑，<br><em>先看看今天要做什么。</em></h1>
<p class="intro">把课表、待办、笔记、资料和邮件放在一起。<br>上课、交作业、读论文，从同一个工作台开始。</p>
<div class="buttons"><a class="primary" href="https://github.com/yzbcs/NEU-Dela/releases/latest">下载 NEU Dot <span aria-hidden="true">↓</span></a><a class="secondary" href="#demo">观看操作演示 <span aria-hidden="true">↓</span></a></div>
<p class="platforms">macOS · Apple Silicon　/　Windows · x64</p>
</section>
<section class="wrap demo" id="demo" aria-label="功能演示">
<figure class="window app-preview">
<div class="preview-frame">
<img id="app-shot" src="./assets/screenshots/home-light.png" alt="NEU Dot 桌面应用的工作台首页">
<iframe id="demo-app" title="NEU Dot 演示界面" tabindex="-1" aria-hidden="true" sandbox="allow-same-origin allow-scripts"></iframe>
<div class="demo-pointer" id="demo-pointer" aria-hidden="true" hidden>
  <span class="pointer-tap"></span>
  <svg viewBox="0 0 24 27" focusable="false">
    <defs>
      <linearGradient id="pointer-fill" x2="0" y2="1">
        <stop stop-color="#4b9e8f"/>
        <stop offset="1" stop-color="#246258"/>
      </linearGradient>
    </defs>
    <path d="M3 2.5 21 14.7l-8.3 1.4 3.7 7.5-3.3 1.6-3.7-7.5L3 23z" fill="url(#pointer-fill)" stroke="#fcfffd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
<button class="preview-play" id="preview-play" type="button" aria-label="播放演示"><span aria-hidden="true">▶</span></button>
</div>
<figcaption class="sr-only" id="preview-description" aria-live="polite">全程使用示例数据。点击演示画面可以播放或暂停。</figcaption>
</figure>
</section>
<section class="wrap contribution" aria-labelledby="contribute-title">
<div><p class="eyebrow">一起改进</p><h2 id="contribute-title">试试你的校园工作台</h2><p>用起来哪里卡手，欢迎提 Issue。想修个 Bug、补份文档或加个功能，也欢迎提交 PR。</p></div>
<div class="buttons"><a class="primary" href="https://github.com/yzbcs/NEU-Dela/releases/latest">下载安装</a><a class="secondary" href="https://github.com/yzbcs/NEU-Dela/issues">反馈问题 ↗</a><a class="secondary" href="https://github.com/yzbcs/NEU-Dela/blob/main/CONTRIBUTING.md">参与贡献 ↗</a></div>
</section>
</main>
<footer class="wrap footer"><span>NEU Dot</span><a href="https://github.com/yzbcs/NEU-Dela">项目源码 ↗</a></footer>
</body>
</html>
