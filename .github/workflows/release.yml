name: Release installers

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['docs/releases/v*.md', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'push' || github.ref_type == 'tag' ||
      startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version and release notes
        id: release
        if: github.event_name == 'push'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const tag = `v${version}`;
          if (lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('package.json and package-lock.json versions must match');
          }
          const requested = process.env.GITHUB_REF_TYPE === 'tag'
            ? process.env.GITHUB_REF_NAME
            : process.env.HEAD_COMMIT_MESSAGE.split('\n', 1)[0].slice('release: '.length);
          if (requested !== tag) throw new Error('Requested version must match package.json');
          readFileSync(`docs/releases/${tag}.md`, 'utf8');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            installer: assets/output/releases/*.dmg
          - os: windows-2022
            platform: win
            arch: x64
            installer: assets/output/releases/*.exe
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  publish:
    needs: [prepare, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          merge-multiple: true
          path: assets/output/release-download
      - name: Upload both installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/$RELEASE_TAG.md"
          tag_refs="$(git ls-remote --tags --sort=refname origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_commit="$(tail -n 1 <<< "$tag_refs" | cut -f1)"
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG points to a different commit."
            exit 1
          fi
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "::error::$RELEASE_TAG is already published; create a new version."
            exit 1
          fi
          if [[ "$draft" != true ]]; then
            tag_args=(--verify-tag)
            if [[ "$GITHUB_REF_TYPE" == branch ]]; then
              tag_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$RELEASE_TAG" "${tag_args[@]}" --draft \
              --title "NEU-Dela $version" --notes-file "$notes"
          elif [[ "$GITHUB_REF_TYPE" == branch && -z "$tag_commit" ]] &&
            [[ "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" != "$GITHUB_SHA" ]]; then
            echo "::error::$RELEASE_TAG draft targets a different commit."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            "assets/output/release-download/NEU-Dela-$version-arm64.dmg" \
            "assets/output/release-download/NEU-Dela Setup $version.exe" --clobber
          if [[ "$version" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "$notes"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
          fi
