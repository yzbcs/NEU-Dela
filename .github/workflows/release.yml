name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check version and release notes
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Version tag must match package.json');
          }
          readFileSync(`docs/releases/v${version}.md`, 'utf8');
          NODE

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            executable: assets/output/releases/mac-arm64/NEU-Dela.app/Contents/MacOS/NEU-Dela
            installer: assets/output/releases/*.dmg
          - os: windows-2022
            platform: win
            arch: x64
            executable: assets/output/releases/win-unpacked/NEU-Dela.exe
            installer: assets/output/releases/*.exe
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Check packaged settings and restart
        run: npm run smoke:settings -- "${{ matrix.executable }}"
      - name: Check packaged local files and restart
        run: npm run smoke:files -- "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save desktop reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-reports-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            assets/output/settings-validation/*.json
            assets/output/settings-validation/*.png
            assets/output/settings-validation/*.txt
            assets/output/local-files-validation/*.json
            assets/output/local-files-validation/*.png
            assets/output/local-files-validation/*.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          merge-multiple: true
          path: assets/output/release-download
      - name: Upload both installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          notes="docs/releases/$RELEASE_TAG.md"
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" = false ]; then
            echo "::error::$RELEASE_TAG is already published; create a new version."
            exit 1
          fi
          if [ "$draft" != true ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "NEU-Dela $version" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" \
            "assets/output/release-download/NEU-Dela-$version-arm64.dmg" \
            "assets/output/release-download/NEU-Dela Setup $version.exe" --clobber
          if [[ "$version" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "$notes"
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$notes"
          fi
